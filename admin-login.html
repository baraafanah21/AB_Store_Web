<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AB Store — Staff Sign In</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css-files/admin.css" />
</head>
<body class="admin-login-body">
  <div class="login-card">
    <div class="login-brand">AB <span>Store</span></div>
    <p class="login-sub">Staff sign in for admin and employee dashboards</p>

    <form id="staffLoginForm" autocomplete="off">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="staff@abstore.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <div class="form-msg" id="msg" hidden></div>

      <button type="submit" class="btn-primary" id="submitBtn">
        Sign In&nbsp;<i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="admin-entry-actions">
      <a class="btn-ghost" href="index.html">Back to Store</a>
    </div>
  </div>

  <script src="js-files/roles-dash/Auth.js"></script>
  <script src="js-files/admin/login.js"></script>
</body>
</html>
